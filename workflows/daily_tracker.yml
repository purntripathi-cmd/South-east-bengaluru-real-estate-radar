name: Daily Real Estate Price & Rental Radar Tracker

on:
  schedule:
    # Runs daily at 06:00 UTC (11:30 AM IST)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  track-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily Tracker Script
        run: |
          python scripts/daily_tracker.py

      - name: Check for Changes and Commit Snapshot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -n "$(git status --porcelain data/)" ]; then
            git add data/historical_prices.csv data/daily_tracker_log.json
            git commit -m "chore(data): automated daily market rate snapshot [skip ci]"
            git push origin main
            echo "Successfully updated and committed daily market snapshot."
          else
            echo "No price delta detected; snapshot is already up to date."
          fi
