name: Daily Real Estate & Rental Radar Tracker (5 PM IST)

on:
  schedule:
    # 5:00 PM IST is 11:30 UTC daily
    - cron: '30 11 * * *'
  workflow_dispatch:

jobs:
  track-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute 5:00 PM IST Daily Tracker
        run: |
          python scripts/daily_tracker.py --force

      - name: Commit and Push Daily Snapshots & Top CSVs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/top_10_purchase_daily.csv data/top_5_rental_daily.csv data/historical_prices.csv data/daily_tracker_log.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): automated 5 PM IST radar snapshot [skip ci]" && git push origin main)
